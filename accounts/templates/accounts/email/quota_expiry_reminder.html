<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
        <tr><td>
          <h1 style="margin:0 0 16px;font-size:24px;">Plan expiring in {{ days_remaining }} days</h1>
          <p style="margin:0 0 16px;line-height:1.5;">Your <strong>{{ plan_label }}</strong> entitlement for <strong>{{ tenant_name }}</strong> expires on <strong>{{ ends_at }}</strong>.</p>
          <p style="margin:0 0 20px;color:#4b5563;">{{ quota_remaining }} of {{ quota_limit }} signatures remaining ({{ quota_used }} used).</p>
          <p style="margin:0 0 24px;"><a href="{{ dashboard_url }}" style="display:inline-block;background:#ff6600;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;">View dashboard</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
