<meta name="description" content="{% block seo_description %}{{ seo_meta_description }}{% endblock %}">
<meta name="robots" content="{% block seo_robots %}{{ seo_robots }}{% endblock %}">
<meta name="theme-color" content="#020626" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
{% if google_site_verification %}
<meta name="google-site-verification" content="{{ google_site_verification }}">
{% endif %}
<link rel="canonical" href="{% block seo_canonical %}{{ seo_canonical_url }}{% endblock %}">
<link rel="alternate" hreflang="en" href="{% block seo_hreflang_en %}{{ seo_canonical_url }}{% endblock %}">
<link rel="alternate" hreflang="x-default" href="{% block seo_hreflang_default %}{{ seo_canonical_url }}{% endblock %}">
<meta property="og:site_name" content="{{ seo_product_name }}">
<meta property="og:title" content="{% block seo_og_title %}{{ seo_page_title }}{% endblock %}">
<meta property="og:description" content="{% block seo_og_description %}{{ seo_meta_description }}{% endblock %}">
<meta property="og:url" content="{{ seo_canonical_url }}">
<meta property="og:type" content="{{ seo_og_type }}">
<meta property="og:locale" content="en_IN">
{% if seo_og_image %}
<meta property="og:image" content="{{ seo_og_image }}">
<meta property="og:image:width" content="{{ seo_og_image_width }}">
<meta property="og:image:height" content="{{ seo_og_image_height }}">
<meta property="og:image:alt" content="{{ seo_og_image_alt }}">
<meta name="twitter:image" content="{{ seo_og_image }}">
<meta name="twitter:image:alt" content="{{ seo_og_image_alt }}">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block seo_twitter_title %}{{ seo_page_title }}{% endblock %}">
<meta name="twitter:description" content="{% block seo_twitter_description %}{{ seo_meta_description }}{% endblock %}">
