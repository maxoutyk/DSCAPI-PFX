{% if google_ads_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ google_ads_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ google_ads_id }}');
</script>
{% endif %}
